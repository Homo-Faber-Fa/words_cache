name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Системные пакеты
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip autoconf libtool \
            pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev automake

      - name: Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer "cython<3.0"

      - name: Настройка spec
        run: |
          [ -f buildozer.spec ] || buildozer init
          sed -i 's/^title = .*/title = Карточки слов/' buildozer.spec
          sed -i 's/^package.name = .*/package.name = flashcards/' buildozer.spec
          sed -i 's/^package.domain = .*/package.domain = org.myname/' buildozer.spec
          sed -i 's/^requirements = .*/requirements = python3,kivy==2.3.1,openssl,certifi/' buildozer.spec
          sed -i 's/^#*source.include_exts = .*/source.include_exts = py,csv,png,jpg,kv,atlas,ttf/' buildozer.spec
          sed -i 's/^#*android.permissions = .*/android.permissions = INTERNET/' buildozer.spec
          sed -i 's/^#*android.accept_sdk_license = .*/android.accept_sdk_license = True/' buildozer.spec
          sed -i 's/^#*android.archs = .*/android.archs = arm64-v8a/' buildozer.spec
          sed -i 's/^#*orientation = .*/orientation = portrait/' buildozer.spec

      - uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}

      - name: Сборка
        run: buildozer -v android debug

      - uses: actions/upload-artifact@v4
        with:
          name: flashcards-apk
          path: bin/*.apk