name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Системные пакеты
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip autoconf automake libtool \
            libltdl-dev pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev gettext

      - name: Установка Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install "buildozer==1.6.0" "cython<3.0" virtualenv

      - name: Настройка buildozer.spec
        run: |
          rm -f buildozer.spec
          buildozer init
          python - <<'PY'
          import configparser
          cp = configparser.ConfigParser(strict=False)
          cp.optionxform = str                      # сохраняем регистр ключей
          cp.read('buildozer.spec', encoding='utf-8')
          settings = {
              'title': 'Карточки слов',
              'package.name': 'wordscache',
              'package.domain': 'org.homofaber',
              'source.dir': '.',
              'source.include_exts': 'py,csv,png,jpg,kv,atlas,ttf',
              'version': '1.0',
              'requirements': 'python3,kivy,certifi,openssl',
              'orientation': 'portrait',
              'fullscreen': '0',
              'android.permissions': 'INTERNET',
              'android.api': '36',
              'android.minapi': '24',
              'android.ndk_api': '24',
              'android.ndk': '29',
              'android.archs': 'arm64-v8a',
              'android.accept_sdk_license': 'True',
              'android.allow_backup': 'True',
              'p4a.branch': 'develop',
          }
          for key, value in settings.items():
              cp.set('app', key, value)
          with open('buildozer.spec', 'w', encoding='utf-8') as f:
              cp.write(f)
          print('Настройки применены, дубликатов нет')
          PY
          echo "--- итоговый spec ---"
          grep -E "^(title|package\.|version|requirements|orientation|source\.include_exts|android\.(api|ndk|archs|permissions|accept_sdk_license)|p4a\.branch)" buildozer.spec

      - name: Кэш SDK/NDK
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}-v3

      # строго ПОСЛЕ кэша, иначе кэш затрёт файлы лицензий
      - name: Принятие лицензий Android SDK
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK/licenses"
          printf '\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n' > "$SDK/licenses/android-sdk-license"
          printf '\n84831b9409646a918e30573bab4c9c91346d8abd\n' > "$SDK/licenses/android-sdk-preview-license"
          printf '\nd975f751698a77b662f1254ddbeed3901e976f5a\n' > "$SDK/licenses/intel-android-extra-license"
          printf '\n33b6a2b64607f11b759f320ef9dff4ae5c47d97a\n' > "$SDK/licenses/google-gdk-license"
          printf '\ne9acab5b5fbb560a72cfaecce8946896ff6aab9d\n' > "$SDK/licenses/mips-android-sysimage-license"
          ls -l "$SDK/licenses"

      - name: Сборка APK
        run: |
          set -o pipefail
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          if ! buildozer -v android debug 2>&1 | tee build.log; then
            echo "=== первый проход упал: принимаем лицензии и ставим build-tools вручную ==="
            SM="$(find "$SDK" -type f -name sdkmanager 2>/dev/null | head -n1)"
            if [ -z "$SM" ]; then
              echo "sdkmanager не найден, повтор невозможен"; exit 1
            fi
            yes | "$SM" --sdk_root="$SDK" --licenses >/dev/null || true
            yes | "$SM" --sdk_root="$SDK" "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true
            grep -q '^android.skip_update' buildozer.spec || \
              sed -i '/^\[app\]/a android.skip_update = True' buildozer.spec
            buildozer -v android debug 2>&1 | tee -a build.log
          fi

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: wordscache-apk
          path: bin/*.apk

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log
